name: Deploy to Oracle
on:
  push:
    branches: [main]
    paths:
      - "apps/main/**"
      - "apps/cms/**"
      - "libs/**"
      - "deploy/on-oracle.sh"
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch:
concurrency:
  group: deploy-cptsd
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync + deploy main + cms on oracle-a
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy" \
            --exclude .git --exclude node_modules --exclude .next --exclude dist \
            --exclude .env --exclude '*.env.production' \
            ./ "ubuntu@$HOST:/opt/cptsd-repo/"
          ssh -i ~/.ssh/deploy "ubuntu@$HOST" 'bash /opt/cptsd-repo/deploy/on-oracle.sh'
