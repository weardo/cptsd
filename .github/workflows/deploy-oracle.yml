name: Deploy to Oracle

# Thin caller: deploy logic lives once in weardo/ci (public reusable workflow).
# cptsd is a monorepo (builds main + cms) -> script mode.
on:
  push:
    branches: [main]
    paths:
      - "apps/main/**"
      - "apps/cms/**"
      - "libs/**"
      - "deploy/on-oracle.sh"
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: weardo/ci/.github/workflows/deploy-oracle.yml@main
    with:
      app: cptsd
      deploy_path: /opt/cptsd-repo
      run_mode: script
      deploy_script: deploy/on-oracle.sh
    secrets: inherit
